[package]
name = "vario-gui"
description = "Vario's graphical interface: install, check and follow the delegations without a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The private API gives a transparent window on macOS: only the rounded panel shows.
tauri = { version = "2", features = ["macos-private-api"] }
vario-core = { path = "../vario-core" }

# macOS: every Space, and putting the gauge on screen without taking the focus.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Not the workspace's `forbid`: the one pointer cast to NSWindow needs a local allow.
[lints.rust]
unsafe_code = "deny"
