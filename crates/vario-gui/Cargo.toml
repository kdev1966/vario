[package]
name = "vario-gui"
description = "Vario's graphical interface: install, check and follow the delegations without a terminal."
version.workspace = true
edition.workspace = true
# Slint 1.18 needs Rust 1.92; the core and the command line keep the workspace's 1.88.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The winit integration (unstable, hence the ~1.18 pin) makes the gauge a floating
# system window: its level, its taskbar entry, the macOS activation policy.
slint = { version = "~1.18", features = ["unstable-winit-030"] }
vario-core = { path = "../vario-core" }

# macOS: the gauge joins every Space (NSWindow.collectionBehavior), which winit does
# not offer. The versions are the ones Slint already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[dev-dependencies]
# Runs the window without a screen, so the tests can drive it.
i-slint-backend-testing = "1.18"
tempfile = "3"

[build-dependencies]
slint-build = "1.18"

# Not the workspace's `forbid`: the code Slint generates allows unsafe locally, which
# `forbid` refuses. `deny` still keeps unsafe out of this crate's own code.
[lints.rust]
unsafe_code = "deny"
