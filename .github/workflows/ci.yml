name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the libraries the interface needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: shellcheck scripts/*.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the libraries the interface needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: cargo test --all-targets --no-fail-fast
      - name: Smoke test the command
        run: |
          cargo run --quiet -p vario -- --version
          cargo run --quiet -p vario -- doctor
          cargo run --quiet -p vario -- hook session-start --via cursor

  macos-app:
    name: Vario.app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/macos-app.sh
      - name: Check the bundle
        run: |
          test -x dist/Vario.app/Contents/MacOS/vario-gui
          test -x dist/Vario.app/Contents/MacOS/vario
          test -f dist/Vario.app/Contents/Resources/Vario.icns
          dist/Vario.app/Contents/MacOS/vario-gui --version
          dist/Vario.app/Contents/MacOS/vario --version
          plutil -lint dist/Vario.app/Contents/Info.plist

  msrv:
    name: minimum Rust version (1.89, core and command line)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # The interface (Tauri) is built by the stable jobs.
      - run: cargo check --all-targets -p vario-core -p vario
